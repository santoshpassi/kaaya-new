@keyframes kaaya-spin3d{0%{transform:rotateY(0) translateY(0) scale(1)}25%{transform:rotateY(90deg) translateY(-3%) scale(.98)}50%{transform:rotateY(180deg) translateY(0) scale(1)}75%{transform:rotateY(270deg) translateY(-3%) scale(.98)}100%{transform:rotateY(360deg) translateY(0) scale(1)}}
@keyframes kaaya-glow{0%,50%,100%{opacity:.45;transform:scale(1)}25%,75%{opacity:.28;transform:scale(.85)}}

/* Value exchange model */
.vx{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2rem;align-items:center;margin-top:1rem}
.vx svg{width:100%;height:auto;display:block;overflow:visible}
.vx .link{opacity:0;transition:opacity .7s;cursor:pointer;outline:none}
.vx .link.show{opacity:1}
.vx .link .hit{fill:none;stroke:transparent;stroke-width:26}
.vx .link .ln{fill:none;stroke-width:2;opacity:.45;transition:opacity .4s,stroke-width .4s}
.vx .link.on .ln,.vx .link:hover .ln,.vx .link:focus-visible .ln{opacity:1;stroke-width:3}
.vx .d1{stroke:var(--terra);fill:var(--terra)} .vx .d2{stroke:var(--forest);fill:var(--forest)}
.vx .node{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.85);transition:opacity .7s,transform .7s}
.vx .node.show{opacity:1;transform:none}
.vx .node circle{fill:var(--paper);stroke:var(--rule);stroke-width:2;transition:stroke .4s}
.vx .node.on circle{stroke:var(--terra);stroke-width:2.5}
.vx .node text{fill:var(--ink);font-family:var(--display);font-size:17px;text-anchor:middle}

.meal{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2.5rem;align-items:center;margin-top:1.25rem;

.meal .arc.on{opacity:1;stroke-width:4.5}
.meal .k-m{stroke:var(--flow-money)} .meal .k-v{stroke:var(--flow-value)}
.meal .ah-m{fill:var(--flow-money);stroke:none} .meal .ah-v{fill:var(--flow-value);stroke:none}

.meal .dot.k-m{fill:var(--flow-money)} .meal .dot.k-v{fill:var(--flow-value)}

    const label=()=>tb.setAttribute('aria-label',cur()==='dark'?'Switch to light colours':'Switch to dark colours');

  function share(){

    const u = encodeURIComponent(url), t = encodeURIComponent(title);

  document.addEventListener('click', async e => {
    const sb = e.target.closest('.share'); if (!sb) return;

})();

  ];
  const NS='http://www.w3.org/2000/svg', svg=box.querySelector('svg');
  const gA=svg.querySelector('.arcs'), gD=svg.querySelector('.dots'), gS=svg.querySelector('.stops');
  const el=(t,at,p)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);p.appendChild(e);return e;};

  const cap=box.querySelector('.meal-cap'), what=cap.querySelector('.what'), h=cap.querySelector('h3'), txt=cap.querySelector('.txt');
  const mvSw=cap.querySelector('.on-move .sw'), mvTx=cap.querySelector('.on-move span'), shotI=box.querySelector('.shot img'), PH=[["/img/model/s1.jpg", "A family and the Kaaya team standing together on the lawn beside a thatched hut"], ["/img/model/s2.jpg", "Guests at a table under a lit thatched hut at night"], ["/img/model/s3.jpg", "Women from the team working together around the kitchen counter"], ["/img/model/s4.jpg", "People sharing a meal around a low table beside a wood fire"], ["/img/model/s5.jpg", "Rows of leafy vegetables in the kitchen garden under green netting"], ["/img/model/s6.jpg", "Steel plates of rice and curry on a wooden table, with people eating under a thatched roof"]];
  const prev=box.querySelector('.prev'), next=box.querySelector('.next');

  }
  function flow(){
    cancelAnimationFrame(raf); gD.innerHTML=''; if(reduce.matches||!visible) return;
    const s=S[cur], L=s.arc.getTotalLength(), ds=[0,1/3,2/3].map(o=>({o,c:el('circle',{r:6,class:'dot k-'+s.k},gD)})), t0=performance.now();
    (function tick(t){const f=(t-t0)/2600; ds.forEach(d=>{const x=(f+d.o)%1,p=s.arc.getPointAtLength(x*L);d.c.setAttribute('cx',p.x.toFixed(1));d.c.setAttribute('cy',p.y.toFixed(1));d.c.style.opacity=Math.sin(Math.PI*x).toFixed(2);}); raf=requestAnimationFrame(tick);})(t0);
  }
  prev.addEventListener('click',()=>go(cur-1)); next.addEventListener('click',()=>go(cur+1));
  box.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(cur+1);} if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}});
  if('IntersectionObserver' in window) new IntersectionObserver(en=>{visible=en[0].isIntersecting;flow();}).observe(box);
  reduce.addEventListener('change',flow);
  go(0);
})();
