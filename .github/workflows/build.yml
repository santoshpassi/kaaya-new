name: Build kaaya.org

# Rebuilds every page from src/template.html and the Wix Blog:
# when the template or build script changes, every morning, or on demand
# (Actions tab → Build kaaya.org → Run workflow).
on:
  push:
    branches: [main]
    paths: ['src/**', 'build/build.mjs', '.github/workflows/build.yml']
  schedule:
    - cron: '17 0 * * *'   # 05:47 in India, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build/build.mjs
      - name: Commit the rebuilt pages
        run: |
          git config user.name "kaaya-build"
          git config user.email "kaaya-build@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "Rebuild pages" && git push)
